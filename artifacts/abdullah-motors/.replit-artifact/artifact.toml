kind = "web"
previewPath = "/"
title = "Abdullah Motors"
description = "A premium car dealership website with real inventory browsing, enquiries, bookings, financing applications, testimonials, blog content, and staff administration backed by Supabase."
version = "1.0.0"
id = "artifacts/abdullah-motors"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18916

[services.development]
run = "pnpm --filter @workspace/abdullah-motors run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/abdullah-motors", "run", "build" ]
serve = "static"
publicDir = "artifacts/abdullah-motors/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18916"
BASE_PATH = "/"
